---
layout: default
---
<!--
  글 한 편의 틀이에요. _posts 폴더의 모든 글이 이 모양으로 보여요.
  page.title, page.tag 같은 값은 글 맨 위 머리 정보(--- 사이)에서 가져와요.
-->
<article class="post">
  <header>
    <div class="meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%Y.%m.%d" }}</time>
      <span class="tag">#{{ page.tag }}</span>
      <span>{{ page.minutes }}분</span>
    </div>
    <h1>{{ page.title }}</h1>
  </header>

  <div class="body">
    {{ content }}
  </div>
</article>

<!-- 이전 글 / 다음 글도 날짜를 보고 자동으로 연결돼요 -->
<nav class="pager" aria-label="다른 글">
  {% if page.previous %}
    <a href="{{ page.previous.url | relative_url }}"><span>← 이전 글</span><b>{{ page.previous.title }}</b></a>
  {% endif %}
  {% if page.next %}
    <a class="next" href="{{ page.next.url | relative_url }}"><span>다음 글 →</span><b>{{ page.next.title }}</b></a>
  {% endif %}
</nav>
